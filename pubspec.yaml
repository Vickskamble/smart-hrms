name: myapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase Packages
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

  # App Packages
  shared_preferences: ^2.2.2
  # pdf 3.13 pulls in xml 7, which excel 4.0.6 caps below 7. Revisit together.
  pdf: ^3.12.0
  # pdf 3.13 / printing 5.15 pull in xml 7, which excel 4.0.6 caps below 7.
  # Revisit all three together.
  printing: ^5.12.0
  intl: ^0.20.3
  provider: ^6.0.5
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10
  lucide_icons: 0.257.0
  fl_chart: ^0.68.0
  geolocator: ^10.0.0

  # Import packages
  file_picker: ^8.0.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true