name: myapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase Packages
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0

  # App Packages
  shared_preferences: ^2.2.2
  provider: ^6.0.5
  intl: ^0.20.3
  geolocator: ^14.1.1
  # pdf 3.13 pulls in xml 7, which excel 4.0.6 caps below 7. Revisit together.
  pdf: ^3.12.0

# Import packages
  # file_picker is back at ^13 - the earlier 8.x pin conflicted on win32 and had
  # to go before geolocator could move to 14. Version 13 is required because
  # 8.x-12.x depend on win32 5 and geolocator 14 needs win32 6.
  file_picker: ^13.1.0
  excel: ^4.0.6

# Removed as unused - none of them were imported anywhere in lib/:
#   firebase_storage, fl_chart, flutter_svg, lucide_icons, google_fonts,
#   printing
# Icons are all Material Icons.*; the dashboard "charts" are hand-rolled
# progress bars, not fl_chart widgets. PDF bytes are produced by ReportPdfService
# but nothing yet prints, saves or shares them.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
